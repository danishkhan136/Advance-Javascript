<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add User Form</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-blue-100 via-purple-100 to-pink-100 min-h-screen text-white">

    <!-- Form Container -->
    <form autocomplete="off" class="bg-[#1e1e1e] rounded-2xl shadow-xl p-8 w-full max-w-lg mx-auto font-sans mb-12 mt-12">
        <h2 class="text-3xl font-bold mb-8 text-center tracking-tight">Add User</h2>

        <!-- Name Field -->
        <div class="mb-5">
            <label class="block font-medium mb-2 text-sm" for="name">Name</label>
            <input class="w-full px-4 py-3 bg-[#2d2d2d] rounded-xl focus:outline-none focus:ring-2 focus:ring-gray-500"
                type="text" id="name" name="name" required>
        </div>

        <!-- Role Field -->
        <div class="mb-5">
            <label class="block font-medium mb-2 text-sm" for="role">Role</label>
            <input class="w-full px-4 py-3 bg-[#2d2d2d] rounded-xl focus:outline-none focus:ring-2 focus:ring-gray-500"
                type="text" id="role" name="role" required>
        </div>

        <!-- Bio Field -->
        <div class="mb-5">
            <label class="block font-medium mb-2 text-sm" for="bio">Bio</label>
            <textarea
                class="w-full px-4 py-3 bg-[#2d2d2d] rounded-xl focus:outline-none focus:ring-2 focus:ring-gray-500 h-32 resize-none"
                id="bio" name="bio" required></textarea>
        </div>

        <!-- Photo URL Field -->
        <div class="mb-8">
            <label class="block font-medium mb-2 text-sm" for="photo-url">Photo URL</label>
            <input class="w-full px-4 py-3 bg-[#2d2d2d] rounded-xl focus:outline-none focus:ring-2 focus:ring-gray-500"
                type="url" id="photoUrl" name="photo_url" required>
        </div>

        <!-- Submit Button -->
        <button type="submit"
            class="w-full px-4 py-3 border border-gray-600 rounded-xl hover:bg-[#333333] transition-colors font-medium text-lg">
            Submit
        </button>
    </form>

    <div class="users grid grid-cols-1 md: grid-cols-3 gap-10 px-6 max-w-6xl mx-auto">

    </div>
    <script src="../Project 3/assets/js/script.js"></script>
</body>

</html>
