<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add User Form</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Form Container -->
    <div class="bg-[#212121] w-full max-w-md rounded-2xl p-8 shadow-xl border border-[#2a2a2a]">

        <!-- Title -->
        <h2 class="text-white text-2xl font-bold text-center mb-8">Add User</h2>

        <form action="#" method="POST" class="space-y-5">

            <!-- Name Field -->
            <div>
                <label for="name" class="block text-sm font-semibold text-gray-200 mb-1.5 ml-1">Name</label>
                <input type="text" id="name" name="name"
                    class="w-full bg-[#323232] text-white rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[#555] transition-all border border-transparent"
                    autocomplete="off">
            </div>

            <!-- Role Field -->
            <div>
                <label for="role" class="block text-sm font-semibold text-gray-200 mb-1.5 ml-1">Role</label>
                <input type="text" id="role" name="role"
                    class="w-full bg-[#323232] text-white rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[#555] transition-all border border-transparent"
                    autocomplete="off">
            </div>

            <!-- Bio Field -->
            <div>
                <label for="bio" class="block text-sm font-semibold text-gray-200 mb-1.5 ml-1">Bio</label>
                <textarea id="bio" name="bio" rows="4"
                    class="w-full bg-[#323232] text-white rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[#555] transition-all border border-transparent resize-none"></textarea>
            </div>

            <!-- Photo URL Field -->
            <div>
                <label foocr="photoUrl" class="block text-sm font-semibold text-gray-200 mb-1.5 ml-1">Photo URL</label>
                <input type="url" id="photoUrl" name="photoUrl"
                    class="w-full bg-[#323232] text-white rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[#555] transition-all border border-transparent"
                    autocomplete="off">
            </div>

            <!-- Submit Button -->
            <div class="pt-2">
                <button type="submit"
                    class="w-full bg-transparent border border-[#3f3f3f] text-white font-semibold rounded-xl px-4 py-3 hover:bg-[#323232] focus:ring-2 focus:ring-[#555] outline-none transition-colors">
                    Submit
                </button>
            </div>

        </form>
    </div>
<script src="../Project 3/assets/js/script.js"></script>
</body>

</html>
