<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Data Details</title>
    <link rel="stylesheet" href="../Project 2 FORM DATA RENDER USING LOCAL STORAGE/assets/css/render.css">
</head>
<body>

    <!-- Center mein bara button (Pehli image ke mutabiq) -->
    <button id="detailsBtn" class="big-center-btn">Details</button>

    <!-- Student Data ki List (Doosri image ke mutabiq heading ke sath) -->
    <div id="dataListContainer" style="display: none;" class="transparent-list">
        <h2 class="data-heading">Student Data</h2>
        
        <ul class="data-items">
            <li><strong>Name:</strong> <span id="rName"></span></li>
            <li><strong>Email:</strong> <span id="rEmail"></span></li>
            <li><strong>Age:</strong> <span id="rAge"></span></li>
            <li><strong>Mobile:</strong> <span id="rMobile"></span></li>
            <li><strong>Gender:</strong> <span id="rGender"></span></li>
            <li><strong>Skills:</strong> <span id="rSkills"></span></li>
        </ul>
    </div>

    <script src="../Project 2 FORM DATA RENDER USING LOCAL STORAGE/assets/js/render.js"></script>
</body>
</html>
