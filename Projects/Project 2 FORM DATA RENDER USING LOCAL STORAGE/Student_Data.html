<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Data Details</title>
    <link rel="stylesheet" href="../Project 2 FORM DATA RENDER USING LOCAL STORAGE/assets/css/render.css">
</head>

<body>

    <!-- Center mein bara button (Pehli image ke mutabiq) -->
    <button id="detailsBtn" class="big-center-btn">Details</button>

    <!-- Student Data ki Table ka Container -->
    <div id="dataListContainer" style="display: none;" class="table-container">
        <h2 class="data-heading">STUDENT DATA</h2>

        <table class="student-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Age</th>
                    <th>Mobile</th>
                    <th>Gender</th>
                    <th>Skills</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- JavaScript yahan automatically rows (tr) add karega -->
            </tbody>
        </table>
    </div>

    <script src="../Project 2 FORM DATA RENDER USING LOCAL STORAGE/assets/js/render.js"></script>
</body>

</html>
